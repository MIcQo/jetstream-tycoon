name: CI (Go & Infra)

on:
  push:
    branches:
      - main
      - "docs/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.x"
  NODE_VERSION: "22"

jobs:
  lint:
    name: Go Lint (gofmt, go vet, simlint, golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
      - name: Run gofmt, go vet, and simlint
        run: make lint-go

  deadcode:
    name: Go Deadcode Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest
      - name: Run deadcode check
        run: make deadcode

  vulncheck:
    name: Go Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: make vulncheck

  prometheus:
    name: Prometheus Config & Alert Rules Check (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
      - name: Validate Prometheus config and alert rules
        run: make prom-check

  compose:
    name: Docker Compose Config Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy/docker-compose.yml
        run: make infra-config-check

  migrations:
    name: Migration Validation (Postgres + ClickHouse)
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jetstream
          POSTGRES_PASSWORD: jetstream
          POSTGRES_DB: jetstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jetstream -d jetstream"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_PASSWORD: jetstream
        ports:
          - 9000:9000
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --password jetstream --query 'SELECT 1'"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Validate migration file conventions (up/down pairs, sequences, no CH Nullable)
        run: make migrations-check
      - name: Install golang-migrate CLI (postgres + clickhouse drivers)
        run: go install -tags 'postgres,clickhouse' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1
      - name: Run Postgres and ClickHouse migrations (up -> down -> up)
        run: |
          make migrate-up
          make migrate-down
          make migrate-up

  unit:
    name: Go Unit Tests (-race)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run Go unit tests with race detector
        run: make test-go

  integration:
    name: Go Integration Tests (-race -tags=integration)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run Go integration tests
        run: make test-integration-go

  fuzz:
    name: Go Fuzz Tests (-fuzz)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run Go fuzz tests
        run: make fuzz-go FUZZ_TIME=5s

  mutation:
    name: Go Mutation Tests (gomutate)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run Go AST mutation tests
        run: make mutate-go

  content-check:
    name: Content & i18n Validation
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Validate content and i18n catalogs
        run: make content-check

  determinism:
    name: Determinism (${{ matrix.target }})
    needs: [unit]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: amd64
            os: ubuntu-latest
          - target: arm64
            os: ubuntu-24.04-arm
          - target: wasm
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup Node.js (for wasm target)
        if: matrix.target == 'wasm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run native determinism check
        if: matrix.target != 'wasm'
        run: |
          make determinism
          go run ./cmd/simwasm -determinism > hash-${{ matrix.target }}.txt
      - name: Run deterministic sim tests compiled to WASM under Node.js
        if: matrix.target == 'wasm'
        run: make determinism-wasm-tests
      - name: Run WASM determinism check under Node.js
        if: matrix.target == 'wasm'
        run: |
          make wasm
          GOROOT_DIR="$(go env GOROOT)"
          if [ -f "$GOROOT_DIR/lib/wasm/wasm_exec_node.js" ]; then
            WASM_EXEC="$GOROOT_DIR/lib/wasm/wasm_exec_node.js"
          else
            WASM_EXEC="$GOROOT_DIR/misc/wasm/wasm_exec_node.js"
          fi
          env -i PATH="$PATH" HOME="$HOME" node "$WASM_EXEC" web/public/sim.wasm -determinism | tee hash-wasm.txt
      - name: Upload state hash
        uses: actions/upload-artifact@v4
        with:
          name: determinism-hash-${{ matrix.target }}
          path: hash-${{ matrix.target }}.txt

  determinism-compare:
    name: Determinism Cross-Check (amd64 == arm64 == wasm)
    runs-on: ubuntu-latest
    needs: [determinism]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes
      - name: Compare hashes across architectures
        run: |
          H_AMD64="$(tr -d ' \n\r' < hashes/determinism-hash-amd64/hash-amd64.txt)"
          H_ARM64="$(tr -d ' \n\r' < hashes/determinism-hash-arm64/hash-arm64.txt)"
          H_WASM="$(tr -d ' \n\r' < hashes/determinism-hash-wasm/hash-wasm.txt)"
          echo "amd64: $H_AMD64"
          echo "arm64: $H_ARM64"
          echo "wasm:  $H_WASM"
          test -n "$H_AMD64"
          test "$H_AMD64" = "$H_ARM64"
          test "$H_AMD64" = "$H_WASM"

  wasm-budget:
    name: WASM Size Budget
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install brotli and binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli binaryen
      - name: Check sim.wasm size budget
        run: make wasm-size-check

  build:
    name: Build Go Binaries & WASM
    runs-on: ubuntu-latest
    needs:
      - lint
      - deadcode
      - vulncheck
      - prometheus
      - compose
      - migrations
      - unit
      - integration
      - fuzz
      - mutation
      - content-check
      - determinism-compare
      - wasm-budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build binaries and WASM
        run: make build
