name: CI (TypeScript)

on:
  push:
    branches:
      - main
      - "docs/**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint:
    name: TS Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web install
      - name: Run TypeScript typecheck
        run: make lint-ts

  unit:
    name: TS Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web install
      - name: Run TypeScript unit tests
        run: make test-ts

  integration:
    name: TS Integration Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web install
      - name: Run TypeScript integration tests
        run: make test-integration-ts

  fuzz:
    name: TS Property & Fuzz Tests (fast-check)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web install
      - name: Run TypeScript fast-check tests
        run: make fuzz-ts

  mutation:
    name: TS Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install web dependencies
        run: npm --prefix web install
      - name: Run TypeScript Stryker mutation tests
        run: make mutate-ts
