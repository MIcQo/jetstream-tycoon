global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "api_server"
    static_configs:
      - targets: ["server:9091"]

  - job_name: "ingestor"
    static_configs:
      - targets: ["ingestor:9092"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]
